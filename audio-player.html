<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Canva Audio Player</title><script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script><style>body{margin:0;padding:20px;background:#f5f5f5;font-family:Arial,sans-serif}.player{max-width:760px;height:130px;background:#111;color:#fff;border-radius:20px;padding:15px;display:flex;align-items:center;gap:18px}.cover{width:100px;height:100px;object-fit:cover;border-radius:12px;background:#333}.content{flex:1}.title{font-weight:700;margin-bottom:10px}audio{width:100%}.upload{margin-top:10px}</style></head><body><div class="player"><img id="cover" class="cover" alt="Cover"><div class="content"><div id="title" class="title">MP3 auswählen</div><audio id="audio" controls></audio><div class="upload"><input type="file" id="fileInput" accept=".mp3,audio/mpeg"></div></div></div><script>const fileInput=document.getElementById('fileInput');const audio=document.getElementById('audio');const cover=document.getElementById('cover');const title=document.getElementById('title');fileInput.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;audio.src=URL.createObjectURL(file);title.textContent=file.name;jsmediatags.read(file,{onSuccess:tag=>{if(tag.tags.title)title.textContent=tag.tags.title;const pic=tag.tags.picture;if(pic){let s='';for(let i=0;i<pic.data.length;i++){s+=String.fromCharCode(pic.data[i]);}cover.src='data:'+pic.format+';base64,'+btoa(s);}},onError:err=>console.log(err)});});</script></body></html>
